name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  data:
    name: Data and builders (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring
          coverage: none
      - name: Derived files match their pinned sources
        run: |
          python3 resources/data/country-sources/build.py --check
          python3 bin/build-country-addresses.py --check
          python3 bin/build-country-phones.py --check
          python3 bin/build-country-readiness.py --check
      - name: Tests
        run: python3 -m unittest discover -s tests -p "test_country_*.py"

  python-lint:
    name: Python lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/ruff-action@v3
        with:
          args: check
      - uses: astral-sh/ruff-action@v3
        with:
          args: format --check

  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4"]
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring
          coverage: none
      - run: composer install --no-interaction --no-progress
      - name: Code style
        if: matrix.php == '8.3'
        run: composer style
      - name: Static analysis
        run: composer analyse
      - name: Tests
        run: composer test
